<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="integraGoldBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea9e32"/>
      <stop offset="100%" stop-color="#d48a20"/>
    </linearGradient>
    <linearGradient id="silverGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Architectural Pillars on Far Left -->
  <rect x="22" y="115" width="13" height="135" rx="1.5" fill="url(#integraGoldBrand)"/>
  <rect x="43" y="82" width="13" height="168" rx="1.5" fill="url(#integraGoldBrand)"/>
  <rect x="64" y="50" width="13" height="200" rx="1.5" fill="url(#integraGoldBrand)"/>

  <!-- Architectural House Gable Roof Outline -->
  <path d="M78 92 L182 14 L282 92 L282 106" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) -->
  <g fill="url(#integraGoldBrand)">
    <rect x="156" y="44" width="20" height="20" rx="2"/>
    <rect x="186" y="44" width="20" height="20" rx="2"/>
    <rect x="156" y="74" width="20" height="20" rx="2"/>
    <rect x="186" y="74" width="20" height="20" rx="2"/>
  </g>

  <!-- Wordmark: integra -->
  <!-- i -->
  <path d="M96 98 V250" stroke="#ffffff" stroke-width="15" stroke-linecap="square"/>

  <!-- n -->
  <path d="M152 250 V172 C152 144 170 130 194 130 C218 130 234 144 234 172 V250" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 160 V250" stroke="#ffffff" stroke-width="15" stroke-linecap="square"/>

  <!-- t -->
  <path d="M276 90 V232 C276 244 284 250 298 250" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 132 H302" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>

  <!-- e -->
  <path d="M336 176 H408 C408 148 390 130 368 130 C344 130 326 152 326 190 C326 226 346 250 372 250 C392 250 405 240 410 228" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- g -->
  <circle cx="458" cy="172" r="36" stroke="#ffffff" stroke-width="15"/>
  <path d="M494 136 V234 C494 262 476 276 448 276 C426 276 414 264 410 258" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- r -->
  <path d="M536 250 V136" stroke="#ffffff" stroke-width="15" stroke-linecap="square"/>
  <path d="M536 166 C546 142 568 132 590 136" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>

  <!-- a -->
  <circle cx="642" cy="190" r="36" stroke="#ffffff" stroke-width="15"/>
  <path d="M678 136 V250" stroke="#ffffff" stroke-width="15" stroke-linecap="square"/>

  <!-- Signature Golden Diagonal Accent on 'a' -->
  <polygon points="674,228 712,266 698,280 666,242" fill="url(#integraGoldBrand)"/>
  <polygon points="698,280 712,266 706,260 692,274" fill="url(#silverGlint)"/>
</svg>
