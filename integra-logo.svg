<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="integraGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b56a"/>
      <stop offset="50%" stop-color="#df9429"/>
      <stop offset="100%" stop-color="#b6772a"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#df9429" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Golden Architectural Pillars -->
  <rect x="14" y="58" width="7" height="42" rx="1.5" fill="url(#integraGoldGrad)" filter="url(#subtleGlow)"/>
  <rect x="25" y="42" width="7" height="58" rx="1.5" fill="url(#integraGoldGrad)" filter="url(#subtleGlow)"/>
  <rect x="36.5" y="26" width="7" height="74" rx="1.5" fill="url(#integraGoldGrad)" filter="url(#subtleGlow)"/>

  <!-- Architectural Gable Roofline -->
  <path d="M43 52 L98 12 L150 52 L150 60" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) -->
  <g fill="url(#integraGoldGrad)" filter="url(#subtleGlow)">
    <rect x="86" y="24" width="10" height="10" rx="1.5"/>
    <rect x="100" y="24" width="10" height="10" rx="1.5"/>
    <rect x="86" y="37.5" width="10" height="10" rx="1.5"/>
    <rect x="100" y="37.5" width="10" height="10" rx="1.5"/>
  </g>

  <!-- Brand Typography: integra -->
  <!-- i -->
  <path d="M51 52 V100" stroke="currentColor" stroke-width="8" stroke-linecap="square"/>

  <!-- n -->
  <path d="M78 100 V66 C78 54 87 48 98 48 C109 48 116 54 116 66 V100" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 60 V100" stroke="currentColor" stroke-width="8" stroke-linecap="square"/>

  <!-- t -->
  <path d="M133 42 V94 C133 98 136 100 142 100" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 58 H145" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>

  <!-- e -->
  <path d="M158 76 H192 C192 63 183 50 174 50 C162 50 154 61 154 75 C154 89 162 100 175 100 C184 100 190 95 193 90" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- g -->
  <circle cx="215" cy="71" r="16.5" stroke="currentColor" stroke-width="8"/>
  <path d="M231.5 56 V97 C231.5 109 223 116 210 116 C200 116 195 110 193 107" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- r -->
  <path d="M250 100 V58" stroke="currentColor" stroke-width="8" stroke-linecap="square"/>
  <path d="M250 70 C254 59 264 54 273 56" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>

  <!-- a -->
  <circle cx="298" cy="76" r="16" stroke="currentColor" stroke-width="8"/>
  <path d="M314 58 V100" stroke="currentColor" stroke-width="8" stroke-linecap="square"/>
  <!-- Signature Gold Accent Slash / Spur on 'a' -->
  <polygon points="313,92 328,107 322,113 309,99" fill="url(#integraGoldGrad)" filter="url(#subtleGlow)"/>
</svg>
