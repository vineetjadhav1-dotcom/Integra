<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="integraGoldBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea9e32"/>
      <stop offset="100%" stop-color="#d48a20"/>
    </linearGradient>
    <linearGradient id="silverGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Architectural Pillars on Left -->
  <rect x="42" y="125" width="15" height="135" rx="2" fill="url(#integraGoldBrand)"/>
  <rect x="66" y="90" width="15" height="170" rx="2" fill="url(#integraGoldBrand)"/>
  <rect x="90" y="55" width="15" height="205" rx="2" fill="url(#integraGoldBrand)"/>

  <!-- Architectural House Gable Roof Outline -->
  <path d="M106 100 L215 18 L320 100 L320 116" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) Under Gable Peak -->
  <g fill="url(#integraGoldBrand)">
    <rect x="188" y="48" width="22" height="22" rx="2.5"/>
    <rect x="220" y="48" width="22" height="22" rx="2.5"/>
    <rect x="188" y="80" width="22" height="22" rx="2.5"/>
    <rect x="220" y="80" width="22" height="22" rx="2.5"/>
  </g>

  <!-- Brand Typography: integra -->
  <!-- i (shares left pillar alignment under roof) -->
  <path d="M125 106 V260" stroke="#ffffff" stroke-width="16" stroke-linecap="square"/>

  <!-- n -->
  <path d="M182 260 V180 C182 150 202 136 226 136 C250 136 268 150 268 180 V260" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M182 165 V260" stroke="#ffffff" stroke-width="16" stroke-linecap="square"/>

  <!-- t -->
  <path d="M312 95 V242 C312 254 320 260 334 260" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M294 138 H338" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- e -->
  <path d="M374 184 H448 C448 154 430 136 408 136 C382 136 364 160 364 198 C364 236 384 260 412 260 C432 260 445 250 450 238" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- g -->
  <circle cx="500" cy="180" r="38" stroke="#ffffff" stroke-width="16"/>
  <path d="M538 142 V244 C538 274 518 288 488 288 C465 288 454 274 450 268" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- r -->
  <path d="M580 260 V142" stroke="#ffffff" stroke-width="16" stroke-linecap="square"/>
  <path d="M580 172 C590 148 614 138 636 142" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- a -->
  <circle cx="692" cy="198" r="38" stroke="#ffffff" stroke-width="16"/>
  <path d="M730 142 V260" stroke="#ffffff" stroke-width="16" stroke-linecap="square"/>

  <!-- Signature Amber Peel / Accent on 'a' -->
  <polygon points="726,238 766,278 752,292 718,252" fill="url(#integraGoldBrand)"/>
  <!-- Glint / Highlight on accent edge -->
  <polygon points="752,292 766,278 760,272 746,286" fill="url(#silverGlint)"/>
</svg>
