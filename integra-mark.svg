<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markGoldBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea9e32"/>
      <stop offset="100%" stop-color="#d48a20"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Pillars on Far Left -->
  <rect x="22" y="115" width="14" height="135" rx="1.5" fill="url(#markGoldBrand)"/>
  <rect x="44" y="82" width="14" height="168" rx="1.5" fill="url(#markGoldBrand)"/>
  <rect x="66" y="50" width="14" height="200" rx="1.5" fill="url(#markGoldBrand)"/>

  <!-- Architectural House Gable Roof Outline -->
  <path d="M80 92 L182 14 L282 92 L282 106" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) -->
  <g fill="url(#markGoldBrand)">
    <rect x="156" y="44" width="20" height="20" rx="2"/>
    <rect x="186" y="44" width="20" height="20" rx="2"/>
    <rect x="156" y="74" width="20" height="20" rx="2"/>
    <rect x="186" y="74" width="20" height="20" rx="2"/>
  </g>

  <!-- Left Wall / Pillar -->
  <path d="M98 98 V250" stroke="#ffffff" stroke-width="16" stroke-linecap="square"/>
</svg>
