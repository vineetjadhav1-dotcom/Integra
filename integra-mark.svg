<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea9e32"/>
      <stop offset="100%" stop-color="#d48a20"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Architectural Pillars on Left -->
  <rect x="36" y="125" width="16" height="135" rx="2" fill="url(#markGold)"/>
  <rect x="62" y="90" width="16" height="170" rx="2" fill="url(#markGold)"/>
  <rect x="88" y="55" width="16" height="205" rx="2" fill="url(#markGold)"/>

  <!-- Architectural House Gable Roof Outline -->
  <path d="M106 100 L215 18 L320 100 L320 116" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) Under Gable Peak -->
  <g fill="url(#markGold)">
    <rect x="188" y="48" width="22" height="22" rx="2.5"/>
    <rect x="220" y="48" width="22" height="22" rx="2.5"/>
    <rect x="188" y="80" width="22" height="22" rx="2.5"/>
    <rect x="220" y="80" width="22" height="22" rx="2.5"/>
  </g>

  <!-- Left Wall / Pillar -->
  <path d="M125 106 V260" stroke="#ffffff" stroke-width="17" stroke-linecap="square"/>
</svg>
