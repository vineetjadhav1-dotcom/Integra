<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="integraMarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b56a"/>
      <stop offset="50%" stop-color="#df9429"/>
      <stop offset="100%" stop-color="#b6772a"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Architectural Pillars -->
  <rect x="14" y="58" width="8" height="44" rx="2" fill="url(#integraMarkGold)"/>
  <rect x="27" y="42" width="8" height="60" rx="2" fill="url(#integraMarkGold)"/>
  <rect x="40" y="26" width="8" height="76" rx="2" fill="url(#integraMarkGold)"/>

  <!-- Architectural Gable Roofline -->
  <path d="M47 52 L98 12 L148 52 L148 62" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Amber Window (2x2 Grid) -->
  <g fill="url(#integraMarkGold)">
    <rect x="85" y="24" width="11" height="11" rx="2"/>
    <rect x="100" y="24" width="11" height="11" rx="2"/>
    <rect x="85" y="38" width="11" height="11" rx="2"/>
    <rect x="100" y="38" width="11" height="11" rx="2"/>
  </g>

  <!-- Base Pillar -->
  <path d="M57 52 V102" stroke="currentColor" stroke-width="9" stroke-linecap="square"/>
</svg>
