<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markGoldBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0952D"/>
      <stop offset="100%" stop-color="#C9882B"/>
    </linearGradient>
  </defs>

  <!-- 3 Golden Pillars (Flush baseline at y=360) -->
  <rect x="25" y="175" width="18" height="185" rx="2" fill="url(#markGoldBrand)"/>
  <rect x="53" y="130" width="18" height="230" rx="2" fill="url(#markGoldBrand)"/>
  <rect x="81" y="85" width="18" height="275" rx="2" fill="url(#markGoldBrand)"/>

  <!-- Architectural House Gable Roof Outline -->
  <path d="M108 95 L245 15 L380 95 L380 115" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pane Square Window (2x2 Grid) -->
  <g fill="url(#markGoldBrand)">
    <rect x="212" y="55" width="28" height="28" rx="2.5"/>
    <rect x="250" y="55" width="28" height="28" rx="2.5"/>
    <rect x="212" y="93" width="28" height="28" rx="2.5"/>
    <rect x="250" y="93" width="28" height="28" rx="2.5"/>
  </g>

  <!-- Left Wall / Stem of i -->
  <path d="M118 105 V360" stroke="#FFFFFF" stroke-width="20" stroke-linecap="square"/>
</svg>
